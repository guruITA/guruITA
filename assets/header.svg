<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main background -->
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0%" stop-color="#0B1120"></stop>
      <stop offset="55%" stop-color="#0F172A"></stop>
      <stop offset="100%" stop-color="#111827"></stop>
    </linearGradient>

    <!-- Subtle blue glow -->
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 100) rotate(140) scale(520 300)">
      <stop stop-color="#2563EB" stop-opacity="0.28"></stop>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Subtle cyan glow -->
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 230) rotate(-25) scale(420 240)">
      <stop stop-color="#06B6D4" stop-opacity="0.16"></stop>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Accent gradient -->
    <linearGradient id="accent" x1="390" y1="0" x2="810" y2="0">
      <stop stop-color="#22D3EE"></stop>
      <stop offset="0.5" stop-color="#3B82F6"></stop>
      <stop offset="1" stop-color="#6366F1"></stop>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"></path>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="18" fill="url(#background)"></rect>

  <!-- Decorative layers -->
  <rect width="1200" height="300" rx="18" fill="url(#grid)"></rect>
  <rect width="1200" height="300" rx="18" fill="url(#blueGlow)"></rect>
  <rect width="1200" height="300" rx="18" fill="url(#cyanGlow)"></rect>

  <!-- Top label -->
  <text x="600" y="64" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="4">
    SOFTWARE ENGINEERING
  </text>

  <!-- Name -->
  <text x="600" y="145" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">
    Gurpreet Singh
  </text>

  <!-- Accent -->
  <rect x="480" y="168" width="240" height="3" rx="1.5" fill="url(#accent)"></rect>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">
    Full-Stack Developer · Software Engineering Student
  </text>

  <!-- Small footer text -->
  <text x="600" y="255" text-anchor="middle" fill="#64748B" font-family="Courier New, monospace" font-size="14">
    build · learn · improve
  </text>

  <!-- Decorative code brackets -->
  <text x="85" y="175" fill="#38BDF8" fill-opacity="0.22" font-family="Courier New, monospace" font-size="76" font-weight="700">
    &lt;/
  </text>

  <text x="1030" y="175" fill="#818CF8" fill-opacity="0.22" font-family="Courier New, monospace" font-size="76" font-weight="700">
    &gt;
  </text>
</svg>